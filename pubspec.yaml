name: service_sphere
description: "Service Sphere — A production-grade service booking and management platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # ── Core UI ──────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  cached_network_image: ^3.4.1
  carousel_slider: ^4.2.1

  # ── State Management ─────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ───────────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Data / Models ────────────────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.4.2
  intl: ^0.19.0

  # ── Charts ───────────────────────────────────────────────────────────
  fl_chart: ^0.69.0

  # ── Image & File Handling ────────────────────────────────────────────
  image_picker: ^1.1.2

  # ── Calendar ─────────────────────────────────────────────────────────
  table_calendar: ^3.1.2

  # ── Local Storage (for mock auth persistence) ─────────────────────────
  shared_preferences: ^2.3.2

  # ── Notifications ────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.3

  # ── Utils ─────────────────────────────────────────────────────────────
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/Images/
    - assets/Animation/

  fonts:
    - family: LoginFont
      fonts:
        - asset: assets/Fonts/PlaywriteDKLoopet-Regular.ttf
